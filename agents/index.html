<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Agentes</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Agentes</h1>
        <button class="add-user-btn" onclick="openModal()">➕ Agregar Agente</button>

        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Descripcion</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <!-- Los usuarios se insertarán aquí dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- Modal para agregar/editar usuarios -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Agregar Usuario</h2>
            <div style="width: 96%;">
                <input type="hidden" id="agent-id">
                <input type="text" id="agent-name" placeholder="Name">
                <input type="text" id="agent-desc" placeholder="Decription">
                <input type="text" id="agent-username" placeholder="Agent name">
                <select id="agent-type">
                    <option value="1">Administrador</option>
                    <option value="2">Agente</option>
                </select>
            </div>
            <button onclick="saveUser()">Guardar</button>            
        </div>
    </div>
    <button onclick="test()">test</button>            
    <div id="test" style="background-color: aliceblue; color: black;"></div>

    <script src="index.js"></script>
</body>
</html>
