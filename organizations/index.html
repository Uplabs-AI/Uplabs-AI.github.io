<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UplabsAi</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <h1 style="display: flex; justify-content: center; margin-top: 20px; color: #000;">Organizations</h1>
    <div class="container" id="cardContainer">
        <div class="form-container">
            <form id="organizationForm">
                <div class="form-group">
                    <label for="companyName">Nombre de Empresa</label>
                    <input type="text" id="company_name" name="company_name" required placeholder="Uplabs AI">
                </div>
                <div class="form-group">
                    <label for="agentName">Nombre de IA </label>
                    <input type="text" id="agent_name" name="agent_name" required placeholder="Ava">
                </div>
                <div class="form-group">
                    <label for="service">CONTEXTO (Dale contexto a tu agente IA)</label>
                    <input type="text" id="service" name="service" required placeholder="Trabajas para una compañía de seguros y necesitas un agente IA para atender a tus clientes">
                </div>
                <div class="form-group" style="border: 1px solid #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; padding: 20px;">
                    <div style="cursor: pointer;" onclick="uploadFile();">
                        <div style="text-align: center; font-size: 30px;">
                            <svg width="1em" height="2em" viewBox="0 0 16 16" class="bi bi-upload" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M.5 8a.5.5 0 0 1 .5.5V12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5a.5.5 0 0 1 1 0V12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V8.5A.5.5 0 0 1 .5 8zM5 4.854a.5.5 0 0 0 .707 0L8 2.56l2.293 2.293A.5.5 0 1 0 11 4.146L8.354 1.5a.5.5 0 0 0-.708 0L5 4.146a.5.5 0 0 0 0 .708z"></path><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0v-8A.5.5 0 0 1 8 2z"></path></svg>
                        </div>
                        <div class="file-placeholder" style="font-size: 12px; color: darkgrey;">Entrena a tu Agente con Informacion de tu Empresa</div>
                    </div>
                </div>            
                <div class="form-group">
                    <label for="number">Telefono a llamar</label>
                    <input type="text" id="number" name="number" required placeholder="+591756666929">
                </div>
                <div class="form-group" id="buttonTest">
                    <button onclick="testCall()">test</button>
                </div>
            </form>
        </div>
    </div>
    <div class="container" id="products">
        
    </div>
    
    
    <script src="index.js"></script>
</body>
</html>
