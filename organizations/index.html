<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UplabsAi</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .form-container {
            color: #000;
            max-width: 500px;
            min-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group input:invalid {
            border-color: red;
        }
        .form-group input:valid {
            border-color: green;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1 style="display: flex; justify-content: center; margin-top: 20px;">Organizations</h1>
    <div class="container" id="cardContainer">
        <div class="form-container">
            <form id="organizationForm">
                <div class="form-group">
                    <label for="companyName">Company Name * {{company_name}}</label>
                    <input type="text" id="company_name" name="company_name" required placeholder="Nacional Seguros">
                </div>
                <div class="form-group">
                    <label for="service">contexto de servicio del agente * {{service}}</label>
                    <input type="text" id="service" name="service" required placeholder="autos por kilometro">
                </div>
                <div class="form-group">
                    <label for="agentName">Agent Name * {{agent_name}}</label>
                    <input type="text" id="agent_name" name="agent_name" required placeholder="agent name">
                </div>
                <div class="form-group">
                    <label for="number">Call to number</label>
                    <input type="text" id="number" name="number" required placeholder="+591756666929">
                </div>
            </form>
        </div>
    </div>
    <div class="container" id="products">
        
    </div>
    <script src="index.js"></script>
</body>
</html>
