0;\n      padding: 0;\n      box-sizing: border-box;\n      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;\n  }\n\n  body {\n      background: #000000;\n      min-height: 100vh;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      color: white;\n      padding: 15px;\n  }\n\n    /* ==== CONTENEDOR DEL FORMULARIO ==== */\n    .form-container {\n      background: rgba(0, 0, 0, 0.85);\n      border-radius: 16px;\n      padding: 32px 24px;\n      width: 100%;\n      max-width: 320px;\n      border: 1px solid rgba(255, 255, 255, 0.12);\n      box-shadow:\n        0 0 12px rgba(129, 6, 244, 0.6),\n        0 0 28px rgba(163, 65, 255, 0.4);\n      position: relative;\n      transition: box-shadow 0.3s ease;\n    }\n    .form-container:hover {\n      box-shadow:\n        0 0 18px rgba(129, 6, 244, 0.6),\n        0 0 40px rgba(163, 65, 255, 0.4);\n    }\n\n    /* ==== GRUPO DE CAMPO ==== */\n    .form-group {\n      margin-bottom: 20px;\n    }\n    label {\n      display: block;\n      margin-bottom: 6px;\n      font-size: 14px;\n      font-weight: 500;\n      color: #eee;\n    }\n\n    /* ==== ESTILO COMÚN PARA INPUTS ==== */\n    input[type=\&quot;text\&quot;],\n    input[type=\&quot;email\&quot;],\n    input[type=\&quot;tel\&quot;] {\n      width: 100%;\n      padding: 10px 12px;\n      background: rgba(255, 255, 255, 0.05);\n      border: 1px solid rgba(255, 255, 255, 0.15);\n      border-radius: 8px;\n      color: #fff;\n      font-size: 14px;\n      transition: border-color 0.3s ease, box-shadow 0.3s ease;\n    }\n    input::placeholder {\n      color: rgba(255, 255, 255, 0.5);\n    }\n    input:focus {\n      outline: none;\n      border-color: #8c11ff;\n      box-shadow: 0 0 6px rgba(161, 61, 255, 0.5);\n      background: rgba(255, 255, 255, 0.07);\n    }\n\n    /* ==== WRAPPER PARA DROPDOWN DE PAÍS ==== */\n    .phone-group {\n      display: flex;\n      gap: 6px;\n      al
