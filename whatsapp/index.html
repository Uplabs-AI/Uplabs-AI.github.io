<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UplabsAi</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <h1 style="display: flex; justify-content: center; margin-top: 20px;">Whatsapp</h1>
    <div class="container" id="cardContainer">
        <div class="form-container">
            <form id="organizationForm">
                <div class="form-group">
                    <label for="companyName">Vapi Url</label>
                    <input type="text" id="vapi_url" required placeholder="https://api.vapi.ai">
                </div>
                <div class="form-group">
                    <label for="agentName">Vapi Token</label>
                    <input type="text" id="vapi_token" required placeholder="token de vapi">
                </div>
                <div class="form-group">
                    <label for="service">Vapi Assistant Id</label>
                    <input type="text" id="vapi_assistant_id" required placeholder="Assistant id vapi">
                </div>
                <div class="form-group">
                    <label for="number">Vapi Phone Numer Id</label>
                    <input type="text" id="vapi_phone_number_id" required placeholder="Phone number id vapi">
                </div>
                <div class="form-group" id="botonsave">
                    <button onclick="saveEnviroments()">Save!!</button>
                </div>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
